# Advisories for the locked dependencies. Cargo.lock is committed (tracyo is an application).
name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/audit.yml
  schedule:
    # Newly published advisories against unchanged dependencies; on this trigger
    # rustsec/audit-check files an issue per advisory instead of failing a check.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  advisories:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
