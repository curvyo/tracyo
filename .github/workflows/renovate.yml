# Self-hosted Renovate; the token is the RENOVATE_TOKEN secret (falls back to GITHUB_TOKEN).
name: Renovate

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.13
        with:
          token: "${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}"
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
