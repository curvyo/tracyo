# The gate of CLAUDE.md on ubuntu for every pull request and push to main (ADR 0007 section 7),
# split into one job per check. `required` is the single name for branch protection.
# Windows and macOS run in nightly.yml, the advisory audit in audit.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # nextest with the kittest and pixel tests on software Vulkan (Mesa) and Xvfb, then the
  # network-less session test and the start smoke test on the same build.
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: System packages (software GL for wgpu, Xvfb, Liberation fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libegl1 xvfb fonts-liberation libxkbcommon-x11-0 libxcb-cursor0 jq
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --status-level fail
        env:
          TRACYO_PIXEL_OUT: ${{ github.workspace }}/pixel-out
      - name: Pixel pictures and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pixel-out
          path: pixel-out
          if-no-files-found: ignore
      - name: Session test with and without network (criterion 23)
        run: |
          set -eu
          exe=$(cargo test -p tracyo-app --test session --no-run --message-format=json | jq -r 'select(.executable != null and .target.name == "session") | .executable')
          cd crates/tracyo-app
          TRACYO_SESSION_OUT="$RUNNER_TEMP/with-network.svg" "$exe" --exact open_trace_and_save_the_logo
          TRACYO_SESSION_OUT="$RUNNER_TEMP/without-network.svg" sudo -E unshare -n "$exe" --exact open_trace_and_save_the_logo
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/without-network.svg"
          cmp "$RUNNER_TEMP/with-network.svg" "$RUNNER_TEMP/without-network.svg"
          TRACYO_SESSION_TEXT_OUT="$RUNNER_TEMP/text-with-network.svg" "$exe" --exact open_read_text_recognise_shapes_and_save
          TRACYO_SESSION_TEXT_OUT="$RUNNER_TEMP/text-without-network.svg" sudo -E unshare -n "$exe" --exact open_read_text_recognise_shapes_and_save
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/text-without-network.svg"
          cmp "$RUNNER_TEMP/text-with-network.svg" "$RUNNER_TEMP/text-without-network.svg"
      - name: Start smoke test
        run: |
          cargo build -p tracyo-app
          status=0
          timeout 5 xvfb-run -a target/debug/tracyo || status=$?
          test "$status" -eq 124

  # The frame budget (criterion 7, 50 ms of UI-thread CPU time) is timed in release only: the
  # debug test is ignored (`heavy.rs`). Same system packages as `test`, release build.
  perf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: System packages (software GL for wgpu, Xvfb, Liberation fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libegl1 xvfb fonts-liberation libxkbcommon-x11-0 libxcb-cursor0 jq
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --release -p tracyo-app --test heavy --status-level fail

  doc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -q --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Proves the `rust-version` of the root Cargo.toml: it is the oldest toolchain that builds.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain from rust-version (overrides rust-toolchain.toml)
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: |
          rustc --version
          cargo check --workspace --all-targets

  machete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete --with-metadata

  typos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1

  # THIRD-PARTY.md lists the licence of every library of the executable, for all five release
  # platforms; it is generated from Cargo.lock, never edited.
  third-party:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain (from rust-toolchain.toml)
        run: rustup show
      - run: cargo fetch --locked
      - run: python3 scripts/third-party.py --check

  required:
    if: always()
    needs: [fmt, clippy, test, perf, doc, deny, msrv, machete, typos, third-party]
    runs-on: ubuntu-24.04
    steps:
      - name: Every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
