[package]
name = "tracyo-app"
description = "Tracyo's window, trace worker, dialogs and settings file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tracyo_app"
path = "src/lib.rs"

[[bin]]
name = "tracyo"
path = "src/main.rs"

[dependencies]
tracyo-core = { path = "../tracyo-core", version = "0.1.0" }
vectrace.workspace = true
kurbo.workspace = true
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu", "x11", "wayland", "accesskit"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
fontdb = "0.24"
resvg = { version = "0.50", default-features = false }
dirs = "7"
tempfile = "3"
anyhow = "1"
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
image.workspace = true
roxmltree = "0.21"
sha2 = "0.10"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1", features = ["time"] }

[lints]
workspace = true
