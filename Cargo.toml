[workspace]
resolver = "3"
members = ["crates/tracyo-core", "crates/tracyo-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/curvyo/tracyo"

[workspace.dependencies]
vectrace = { git = "https://github.com/curvyo/vectrace", tag = "v0.1.1", version = "0.1.1" }
kurbo = { version = "0.13", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.vectrace]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
